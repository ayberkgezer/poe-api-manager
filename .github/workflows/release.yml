name: Release

# release-please derives the next version from conventional commits, opens a
# release PR, and creates the tag and GitHub release when that PR is merged.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: 🔖 Release please
        id: release
        uses: googleapis/release-please-action@v5

  # Publishing lives in this workflow rather than a tag-triggered one because a
  # tag pushed by GITHUB_TOKEN does not trigger other workflows, so a separate
  # publish workflow would never fire. The filename must stay `release.yml` —
  # npm's trusted publisher config pins it.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v5

      # Trusted publishing (OIDC) needs npm >= 11.5.1, which ships with Node 24.
      # setup-node must be v7+: earlier versions exported a dummy NODE_AUTH_TOKEN
      # into .npmrc, which makes npm attempt token auth instead of OIDC.
      - name: 🟢 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm masks publish auth failures as 404, and the npm version is the first
      # thing to rule out, so print it instead of guessing after the fact.
      - name: 🔎 Show npm version
        run: npm -v

      - name: 🍳 Install dependencies
        run: npm ci

      - name: 🧱 Build
        run: npm run build

      - name: 🧪 Test
        run: npm test

      # No NPM_TOKEN: authentication comes from the OIDC token minted by the
      # `id-token: write` permission above. Requires a trusted publisher
      # configured at npmjs.com/package/poe-api-manager/access pointing at this
      # repository and the workflow filename `release.yml`.
      - name: 📦 Publish to NPM
        run: npm publish --provenance --access public

      # release-please creates the GitHub release as a draft, and GitHub does
      # not create the git tag for a draft. Undrafting here is what publishes
      # the release and creates the tag, so neither exists unless npm accepted
      # the package first.
      - name: 🚀 Publish the GitHub release
        run: gh release edit "$TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
