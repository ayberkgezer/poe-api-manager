name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      # Trusted publishing (OIDC) needs npm >= 11.5.1, which ships with Node 24.
      # setup-node must be v7+: earlier versions exported a dummy NODE_AUTH_TOKEN
      # into .npmrc, which makes npm attempt token auth instead of OIDC.
      - name: 🟢 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm >= 11.5.1 is required for OIDC publishing. A 404 on publish is npm
      # masking an auth failure, so knowing this version up front saves a cycle.
      - name: 🔎 Show npm version
        run: npm -v

      - name: 🍳 Install dependencies
        run: npm ci

      - name: 🧱 Build
        run: npm run build

      - name: 🧪 Test
        run: npm test

      - name: 🔎 Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # Idempotent so the job can be re-run after a failed publish without
      # tripping over an already-created release.
      - name: 🚀 Create GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --title "poe-api-manager $GITHUB_REF_NAME" \
            --notes "[CHANGELOG](https://github.com/ayberkgezer/poe-api-manager/blob/main/Changelog.md)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No NPM_TOKEN: authentication comes from the OIDC token minted by the
      # `id-token: write` permission above. Requires a trusted publisher
      # configured at npmjs.com/package/poe-api-manager/access pointing at this
      # repository and the workflow filename `release.yml`.
      - name: 📦 Publish to NPM
        run: npm publish --provenance --access public
